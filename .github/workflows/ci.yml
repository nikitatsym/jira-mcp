name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - tests/**
      - dev.py
      - pyproject.toml
      - package.json
      - .github/workflows/ci.yml
      - docs/**
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - dev.py
      - pyproject.toml
      - package.json
      - .github/workflows/ci.yml
      - docs/**

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest-known"
      - name: Check
        run: uv run python dev.py check

  integration-jira:
    runs-on: ubuntu-latest
    # Skip on PRs from forks where secrets aren't available.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      JIRA_TEST_PROJECT: ${{ secrets.JIRA_TEST_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest-known"
      - name: Verify secrets are set
        run: |
          for v in JIRA_URL JIRA_EMAIL JIRA_TOKEN JIRA_TEST_PROJECT; do
            if [ -z "${!v}" ]; then
              echo "ERROR: secret $v is empty — set repository secrets" >&2
              exit 1
            fi
          done
      - name: Bootstrap
        run: uv run python scripts/bootstrap.py
      - name: Integration tests
        run: uv run pytest tests/ -m integration -v

  release:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest-known"

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -z "$LATEST" ]; then
            NEXT="1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Set version and build wheel
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml
          uv build --wheel --out-dir dist/

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" dist/*.whl \
            --title "v${VERSION}" \
            --notes "Auto-built from \`main\` branch." \
            --latest

      - name: Prepare Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/simple/jira-mcp
          cp docs/index.html _site/

          # Generate PEP 503 index from all releases
          {
            echo '<!DOCTYPE html><html><body>'
            gh release list --json tagName -q '.[].tagName' | while read -r tag; do
              V="${tag#v}"
              WHL="jira_mcp-${V}-py3-none-any.whl"
              echo "<a href=\"https://github.com/nikitatsym/jira-mcp/releases/download/${tag}/${WHL}\">${WHL}</a>"
            done
            echo '</body></html>'
          } > _site/simple/jira-mcp/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
        id: deployment
